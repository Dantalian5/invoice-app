services:
  db:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_USER: myTestUser 
      POSTGRES_PASSWORD: myTestPassword
      POSTGRES_DB: db_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db-network
    ports:
      - "5432:5432"


volumes:
  pg_data:

networks:
  db-network:
    driver: bridge
